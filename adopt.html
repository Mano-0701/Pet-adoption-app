<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adopt a Pet</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">

  <!-- Compile validate.ts → validate.js -->
  <script src="js/validate.js" defer></script>
</head>

<body class="bg-gray-100">

  <section class="max-w-xl mx-auto bg-white shadow-lg p-10 mt-10 rounded-xl">

    <h2 class="text-3xl font-bold mb-6 text-center">Adoption Form</h2>

    <form id="adoptForm" class="space-y-4">

      <div>
        <label>Full Name</label>
        <input id="name" class="w-full p-3 border rounded-lg" type="text">
      </div>

      <div>
        <label>Email</label>
        <input id="email" class="w-full p-3 border rounded-lg" type="email">
      </div>

      <div>
        <label>Address</label>
        <textarea id="address" class="w-full p-3 border rounded-lg"></textarea>
      </div>

      <button class="bg-orange-500 text-white px-6 py-3 w-full rounded-lg btn-hover">
        Submit
      </button>

    </form>

  </section>

</body>
</html>
